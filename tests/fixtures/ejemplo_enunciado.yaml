---
# Ejemplo (incompleto) tomado del enunciado del proyecto. Define
#   δ([0, B], a) = ([1, a], B, R)
#   δ([0, B], b) = ([1, b], B, R)
# Sirve para comprobar que el parser acepta exactamente ese formato,
# incluyendo el blank escrito como una entrada vacía en tape_alphabet.
q_states:
  q_list:
  - '0'
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  initial: '0'
  final: '5'
alphabet:
- a
- b
tape_alphabet:
- "#"
- X
-
delta:
- params:
    initial_state: '0'
    mem_cache_value:
    tape_input: a
  output:
    final_state: '1'
    mem_cache_value: a
    tape_output:
    tape_displacement: R
- params:
    initial_state: '0'
    mem_cache_value:
    tape_input: b
  output:
    final_state: '1'
    mem_cache_value: b
    tape_output:
    tape_displacement: R
simulation_strings:
- aab#aab
- ab#ab
- abbababa#aba
